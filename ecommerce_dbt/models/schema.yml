version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

  - name: stg_order_items
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: total_price
        tests:
          - not_null

  - name: fct_sales
    description: "Fact table des ventes par produit"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: total_price
        tests:
          - not_null

  - name: kpi_sales
    description: "KPIs globaux calculés pour les dashboards Power BI"
    columns:
      - name: ca_moyen_par_commande
        description: "CA moyen par commande (calculé dans dbt)"
      - name: ca_moyen_par_client
        description: "CA moyen par client (calculé dans dbt)"

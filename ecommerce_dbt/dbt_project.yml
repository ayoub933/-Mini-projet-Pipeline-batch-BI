name: 'ecommerce_dbt'
version: '1.0.0'

profile: 'ecommerce_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  ecommerce_dbt:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: view

seeds:
  ecommerce_dbt:
    orders:
      +column_types:
        order_id: string
        customer_id: string
        product_id: string
        product_name: string
        quantity: integer
        unit_price: float
        total_price: float
        order_date: timestamp
        country: string
        product_category_name: string
        product_name_lenght: integer
        product_description_lenght: integer
        product_photos_qty: integer
        product_weight_g: float
        product_length_cm: float
        product_height_cm: float
        product_width_cm: float


